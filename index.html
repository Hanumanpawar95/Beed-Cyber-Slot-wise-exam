<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Upload and Print Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    input[type="text"], input[type="file"], button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 5px;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table, th, td {
      border: 1px solid #ddd;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f4f4f4;
      color: #333;
    }

    .btn-container {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSV Upload and Report</h1>

    <!-- Input field for table headers -->
    <label for="headers">Enter Table Headers (Comma-Separated):</label>
    <input type="text" id="headers" placeholder="e.g., Name, Age, Department">

    <!-- File upload input -->
    <label for="csvFile">Upload CSV File:</label>
    <input type="file" id="csvFile" accept=".csv">

    <!-- Buttons -->
    <div class="btn-container">
      <button id="uploadButton">Upload and Display</button>
      <button id="printButton">Print Report</button>
    </div>

    <!-- Table to display data -->
    <table id="dataTable">
      <thead>
        <tr id="tableHeaders"></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // Reference to elements
    const headersInput = document.getElementById("headers");
    const csvFileInput = document.getElementById("csvFile");
    const uploadButton = document.getElementById("uploadButton");
    const printButton = document.getElementById("printButton");
    const tableHeaders = document.getElementById("tableHeaders");
    const tableBody = document.querySelector("#dataTable tbody");

    // Function to display the CSV data
    function displayCSVData(data) {
      // Clear previous table rows
      tableBody.innerHTML = "";

      // Add rows to the table
      data.forEach((row) => {
        const tr = document.createElement("tr");
        row.forEach((cell) => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      });
    }

    // Event listener for Upload button
    uploadButton.addEventListener("click", () => {
      const file = csvFileInput.files[0];

      if (!file) {
        alert("Please upload a CSV file.");
        return;
      }

      // Set table headers
      const headers = headersInput.value.split(",").map((header) => header.trim());
      tableHeaders.innerHTML = ""; // Clear previous headers
      headers.forEach((header) => {
        const th = document.createElement("th");
        th.textContent = header;
        tableHeaders.appendChild(th);
      });

      // Parse the CSV file
      Papa.parse(file, {
        complete: (result) => {
          displayCSVData(result.data);
        },
        error: (error) => {
          console.error("Error parsing CSV:", error);
          alert("Error parsing CSV file.");
        },
      });
    });

    // Event listener for Print button
    printButton.addEventListener("click", () => {
      const originalContent = document.body.innerHTML;
      const printContent = document.querySelector(".container").innerHTML;

      document.body.innerHTML = printContent;
      window.print();
      document.body.innerHTML = originalContent;
      window.location.reload(); // Reload to restore functionality
    });
  </script>
</body>
</html>
