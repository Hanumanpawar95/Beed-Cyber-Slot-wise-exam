<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
   <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #FF5733;
            font-size: 2.5rem;
            margin-top: 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            font-size: 2rem;
            margin: 10px 0 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 30px;
            background: linear-gradient(to bottom, #ffffff, #f4f4f4);
            border-radius: 15px;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border: 3px solid #000;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border: 3px solid #000;
        }

        th {
            background-color: #FF5733;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:nth-child(odd) {
            background-color: #fff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        td {
            color: #555;
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 20px auto;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 200px;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        .upload-form {
            margin-top: 20px;
        }

        .upload-form input[type="file"] {
            display: none;
        }

        .custom-file-label {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            text-transform: uppercase;
            font-weight: bold;
        }

        .upload-form button {
            background-color: #FF5733;
            color: white;
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .upload-form button:hover {
            background-color: #e84c31;
        }

        #result {
            margin-top: 30px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #888;
        }

        footer a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Beed Cyber Infotech KYP</h1>
        <h2>Final Exam Slot Wise</h2>
    <form id="uploadForm">
        <label for="tableHeader">Enter Table Header Text:</label>
        <input type="text" id="tableHeader" placeholder="Enter your table header" required>
        <label for="csvFile">Select CSV File:</label>
        <input type="file" id="csvFile" name="csvFile" accept=".csv">
        <button type="submit">Upload and Process</button>
    </form>
    <div id="result"></div>
      <!-- Print Button -->
        <button id="printButton">Print Report</button>
    </div>

    <!-- Footer -->
    <footer>
        <p>This page developed by <strong>Mr. Hanuman Pawar</strong>.</p>
        <p><em>This data is computer generated.</em></p>
    </footer>
  <script>
        document.getElementById("uploadForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText) {
                alert('Please enter the table header text');
                return;
            }

            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            try {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        console.log(results.data);
                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th colspan="8">${tableHeaderText}</th>
                                </tr>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Learner Name</th>
                                    <th>Learner Code</th>
                                    <th>Batch</th>
                                    <th>BS-CIT</th>
                                    <th>BS-CLS</th>
                                    <th>BS-CSS</th>
                                    <th>Sign</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        const learnerData = {};
                        results.data.forEach((row) => {
                            const learnerCode = row['Learner Code'];
                            const examSlot = row['Exam Slot'];
                            const learnerName = row['Name'] || 'N/A';
                            const course = row['Course'];
                            const batch = row['Batch'] || 'N/A';

                            if (!learnerData[learnerCode]) {
                                learnerData[learnerCode] = {
                                    name: learnerName,
                                    learnerCode,
                                    batch,
                                    BS_CIT: '-',
                                    BS_CLS: '-',
                                    BS_CSS: '-'
                                };
                            }

                            if (course === 'BS-CIT') learnerData[learnerCode].BS_CIT = examSlot || '-';
                            if (course === 'BS-CLS') learnerData[learnerCode].BS_CLS = examSlot || '-';
                            if (course === 'BS-CSS') learnerData[learnerCode].BS_CSS = examSlot || '-';
                        });

                        let serialNumber = 0;
                        for (const learnerCode in learnerData) {
                            const learner = learnerData[learnerCode];
                            if (learner.BS_CIT !== '-' || learner.BS_CLS !== '-' || learner.BS_CSS !== '-') {
                                serialNumber++;
                                tableHtml += `<tr>
                                    <td>${serialNumber}</td>
                                    <td>${learner.name}</td>
                                    <td>${learner.learnerCode}</td>
                                    <td>${learner.batch}</td>
                                    <td>${learner.BS_CIT}</td>
                                    <td>${learner.BS_CLS}</td>
                                    <td>${learner.BS_CSS}</td>
                                    <td></td>
                                </tr>`;
                            }
                        }

                        tableHtml += "</tbody></table>";
                        document.getElementById("result").innerHTML = tableHtml;
                        document.getElementById("printButton").style.display = "block";
                    },
                    error: function(error) {
                        alert("Error parsing CSV file.");
                    }
                });
            } catch (err) {
                alert("Error uploading file.");
            }
        });

        document.getElementById("printButton").addEventListener("click", () => {
            const printContent = document.getElementById("result").innerHTML;
            const printWindow = window.open("", "", "width=800,height=600");
            printWindow.document.write(`<html><head><title>Print Report</title></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            printWindow.print();
        });
    </script>
</body>
</html>
