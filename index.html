<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7fc;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        form {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        form input[type="text"],
        form input[type="file"],
        form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form button {
            background-color: #0056b3;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }
        form button:hover {
            background-color: #003d80;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #0056b3;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center {
            text-align: center;
        }
        #printButton {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #printButton:hover {
            background-color: #1e7e34;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <h1>Upload Learner CSV Data</h1>
    <form id="uploadForm">
        <label for="tableHeader">Enter Table Header Text:</label>
        <input type="text" id="tableHeader" placeholder="Enter your table header" required>
        <label for="csvFile">Select CSV File:</label>
        <input type="file" id="csvFile" name="csvFile" accept=".csv" required>
        <button type="submit">Upload and Process</button>
    </form>
    <div id="result"></div>
    <button id="printButton" style="display: none;" onclick="printReport()">Print Report</button>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText || !file) {
                alert("Please fill all required fields");
                return;
            }

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                dynamicTyping: true,
                complete: function(results) {
                    let tableHtml = `<table>
                        <thead>
                            <tr>
                                <th colspan="8" style="text-align: center;">${tableHeaderText}</th>
                            </tr>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Learner Name</th>
                                <th>Learner Code</th>
                                <th>Batch</th>
                                <th>BS-CIT</th>
                                <th>BS-CLS</th>
                                <th>BS-CSS</th>
                                <th>Present Student Sign</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    const learnerData = {};
                    results.data.forEach(row => {
                        const { 'Learner Code': code, 'Exam Slot': slot, Name: name = 'N/A', Course: course, Batch: batch = 'N/A' } = row;

                        if (!learnerData[code]) learnerData[code] = { name, code, batch, BS_CIT: '-', BS_CLS: '-', BS_CSS: '-' };
                        if (course === 'BS-CIT') learnerData[code].BS_CIT = slot || '-';
                        else if (course === 'BS-CLS') learnerData[code].BS_CLS = slot || '-';
                        else if (course === 'BS-CSS') learnerData[code].BS_CSS = slot || '-';
                    });

                    let serialNumber = 0;
                    for (const code in learnerData) {
                        const learner = learnerData[code];
                        if (learner.BS_CIT !== '-' || learner.BS_CLS !== '-' || learner.BS_CSS !== '-') {
                            serialNumber++;
                            tableHtml += `<tr>
                                <td>${serialNumber}</td>
                                <td>${learner.name}</td>
                                <td>${learner.code}</td>
                                <td>${learner.batch}</td>
                                <td>${learner.BS_CIT !== '-' ? learner.BS_CIT : ''}</td>
                                <td>${learner.BS_CLS !== '-' ? learner.BS_CLS : ''}</td>
                                <td>${learner.BS_CSS !== '-' ? learner.BS_CSS : ''}</td>
                                <td></td>
                            </tr>`;
                        }
                    }

                    tableHtml += `</tbody></table>`;
                    document.getElementById("result").innerHTML = tableHtml;
                    document.getElementById("printButton").style.display = "block";
                },
                error: function(error) {
                    console.error("Error parsing CSV:", error);
                    alert("Error processing file. Please try again.");
                }
            });
        });

        function printReport() {
            window.print();
        }
    </script>
</body>
</html>
