<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;  /* Increased container size */
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #FF5733;
        }

        form {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #FF5733;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e94e26;
        }

        #result {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 2px solid #333; /* Dark and bold border */
        }

        th, td {
            padding: 12px;
            border: 2px solid #333; /* Dark and bold border */
            text-align: center;
        }

        th {
            background-color: #FF5733;
            color: white;
            font-weight: bold;  /* Bold headers */
        }

        td {
            background-color: #ffffff;
        }

        /* Adjust width of 'Sign' column */
        td:last-child, th:last-child {
            width: 150px; /* Increased width for 'Sign' column */
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        footer strong {
            color: #333;
        }

        footer em {
            color: #555;
        }
    </style>
    <!-- Include PapaParse Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Beed Cyber Infotech KYP</h1>
        <h2>Final Exam Slot Wise</h2>

        <form id="uploadForm">
            <label for="tableHeader">Enter Table Header Text:</label>
            <input type="text" id="tableHeader" placeholder="Enter your table header" required>

            <label for="csvFile">Select CSV File:</label>
            <input type="file" id="csvFile" name="csvFile" accept=".csv">

            <button type="button" id="processButton">Upload and Process</button>
        </form>

        <div id="result">
            <!-- Table will be dynamically inserted here -->
        </div>

        <button id="printButton" style="display:none;">Print Report</button>
    </div>

    <footer>
        <p>This page developed by <strong>Mr. Hanuman Pawar</strong>.</p>
        <p><em>This data is computer generated.</em></p>
    </footer>

    <script>
        document.getElementById("processButton").addEventListener("click", function() {
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText) {
                alert('Please enter the table header text');
                return;
            }

            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            try {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        console.log(results.data);
                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th colspan="8">${tableHeaderText}</th>
                                </tr>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Learner Name</th>
                                    <th>Learner Code</th>
                                    <th>Batch</th>
                                    <th>BS-CIT</th>
                                    <th>BS-CLS</th>
                                    <th>BS-CSS</th>
                                    <th>Sign</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        const learnerData = {};
                        results.data.forEach((row) => {
                            const learnerCode = row['Learner Code'];
                            const examSlot = row['Exam Slot'];
                            const learnerName = row['Name'] || 'N/A';
                            const course = row['Course'];
                            const batch = row['Batch'];

                            if (!learnerData[learnerCode]) {
                                learnerData[learnerCode] = {
                                    name: learnerName,
                                    learnerCode: learnerCode,
                                    batch: batch,
                                    BS_CIT: '-',
                                    BS_CLS: '-',
                                    BS_CSS: '-'
                                };
                            }

                            if (course === 'BS-CIT') learnerData[learnerCode].BS_CIT = examSlot || '-';
                            if (course === 'BS-CLS') learnerData[learnerCode].BS_CLS = examSlot || '-';
                            if (course === 'BS-CSS') learnerData[learnerCode].BS_CSS = examSlot || '-';
                        });

                        let srNo = 1;
                        for (const learnerCode in learnerData) {
                            const data = learnerData[learnerCode];
                            // Skip row if all the course columns are marked as '-'
                            if (data.BS_CIT === '-' && data.BS_CLS === '-' && data.BS_CSS === '-') {
                                continue;
                            }
                            tableHtml += `<tr>
                                <td>${srNo++}</td>
                                <td>${data.name}</td>
                                <td>${data.learnerCode}</td>
                                <td>${data.batch}</td>
                                <td>${data.BS_CIT}</td>
                                <td>${data.BS_CLS}</td>
                                <td>${data.BS_CSS}</td>
                                <td></td> <!-- Removed Signature text -->
                            </tr>`;
                        }

                        tableHtml += `</tbody></table>`;

                        document.getElementById("result").innerHTML = tableHtml;
                        document.getElementById("printButton").style.display = "block";
                    },
                    error: function(error) {
                        alert('Error processing file');
                    }
                });
            } catch (e) {
                alert('Error reading file');
            }
        });

        document.getElementById("printButton").addEventListener("click", function() {
            const printContent = document.getElementById("result").innerHTML;
            const printWindow = window.open('', '', 'height=700,width=700');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Print Report</title>
                        <style>
                            body {
                                font-family: Arial, sans-serif;
                                margin: 0;
                                padding: 20px;
                                background-color: #f4f4f4;
                            }
                            table {
                                width: 100%;
                                border-collapse: collapse;
                                margin-top: 20px;
                                border: 2px solid #333; /* Dark and bold border */
                            }
                            th, td {
                                padding: 12px;
                                border: 2px solid #333; /* Dark and bold border */
                                text-align: center;
                            }
                            th {
                                background-color: #FF5733;
                                color: white;
                                font-weight: bold;  /* Bold headers */
                            }
                            td {
                                background-color: #ffffff;
                            }

                            /* Adjust width of 'Sign' column */
                            td:last-child, th:last-child {
                                width: 150px; /* Increased width for 'Sign' column */
                            }
                        </style>
                    </head>
                    <body>
                        ${printContent}
                    </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        });
    </script>
</body>
</html>
