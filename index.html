<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        form input[type="text"], form input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        form button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        form button:hover {
            background-color: #218838;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center {
            text-align: center;
        }
        #printButton {
            margin: 20px 0;
            display: block;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
        }
        #printButton:hover {
            background-color: #0056b3;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <h1>Upload Learner CSV Data</h1>
    <form id="uploadForm">
        <label for="tableHeader">Enter Table Header Text:</label>
        <input type="text" id="tableHeader" placeholder="Enter your table header" required>
        <label for="csvFile">Select CSV File:</label>
        <input type="file" id="csvFile" name="csvFile" accept=".csv">
        <button type="submit">Upload and Process</button>
    </form>
    <div id="result"></div>
    <button id="printButton" style="display:none;">Print Report</button>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText) {
                alert('Please enter the table header text');
                return;
            }

            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            try {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        console.log(results.data);

                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th colspan="8" style="text-align: center;">${tableHeaderText}</th>
                                </tr>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Learner Name</th>
                                    <th>Learner Code</th>
                                    <th>Batch</th>
                                    <th>BS-CIT</th>
                                    <th>BS-CLS</th>
                                    <th>BS-CSS</th>
                                    <th>Present Student Sign</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        const learnerData = {};

                        results.data.forEach((row) => {
                            const learnerCode = row['Learner Code'];
                            const examSlot = row['Exam Slot'];
                            const learnerName = row['Name'] || 'N/A';
                            const course = row['Course'];
                            const batch = row['Batch'] || 'N/A';

                            if (!learnerData[learnerCode]) {
                                learnerData[learnerCode] = {
                                    name: learnerName,
                                    learnerCode: learnerCode,
                                    batch: batch,
                                    BS_CIT: '-',
                                    BS_CLS: '-',
                                    BS_CSS: '-'
                                };
                            }

                            if (course === 'BS-CIT') {
                                learnerData[learnerCode].BS_CIT = examSlot || '-';
                            } else if (course === 'BS-CLS') {
                                learnerData[learnerCode].BS_CLS = examSlot || '-';
                            } else if (course === 'BS-CSS') {
                                learnerData[learnerCode].BS_CSS = examSlot || '-';
                            }
                        });

                        let serialNumber = 0;
                        for (const learnerCode in learnerData) {
                            const learner = learnerData[learnerCode];

                            if (learner.BS_CIT !== '-' || learner.BS_CLS !== '-' || learner.BS_CSS !== '-') {
                                serialNumber++;
                                tableHtml += `<tr>
                                    <td>${serialNumber}</td>
                                    <td>${learner.name}</td>
                                    <td>${learner.learnerCode}</td>
                                    <td>${learner.batch}</td>
                                    <td>${learner.BS_CIT !== '-' ? learner.BS_CIT : ''}</td>
                                    <td>${learner.BS_CLS !== '-' ? learner.BS_CLS : ''}</td>
                                    <td>${learner.BS_CSS !== '-' ? learner.BS_CSS : ''}</td>
                                    <td></td>
                                </tr>`;
                            }
                        }

                        tableHtml += "</tbody></table>";
                        document.getElementById("result").innerHTML = tableHtml;
                        document.getElementById("printButton").style.display = "block";
                    },
                    error: function(error) {
                        console.error("Error parsing CSV file:", error);
                        alert("There was an error parsing the CSV file.");
                    }
                });
            } catch (err) {
                console.error(err);
                document.getElementById("result").textContent = "Error uploading file";
            }
        });

        document.getElementById("printButton").addEventListener("click", () => {
            const printContent = document.getElementById("result").innerHTML;
            const originalContent = document.body.innerHTML;

            document.body.innerHTML = printContent;
            window.print();
            document.body.innerHTML = originalContent;
            location.reload();
        });
    </script>
</body>
</html>
