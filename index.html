<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #FF5733;
            font-size: 3rem;
            margin-top: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            font-size: 2.5rem;
            margin: 10px 0 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: linear-gradient(to bottom, #ffffff, #f4f4f4);
            border-radius: 15px;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        label {
            display: block;
            font-size: 1.2rem;
            color: #555;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        input[type="text"], input[type="file"] {
            width: 90%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: #f9f9f9;
            transition: 0.3s;
        }

        input[type="text"]:focus, input[type="file"]:focus {
            border-color: #FF5733;
            background: #fff;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            margin: 20px auto;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 200px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #45a049;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px auto;
            font-size: 1rem;
            text-align: center;
        }

        th, td {
            border: 2px solid #4CAF50;
            padding: 12px;
        }

        th {
            background-color: #FF5733;
            color: white;
            font-weight: bold;
        }

        td {
            background-color: #ffffff;
        }

        td, th {
            border: 3px solid #4CAF50;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #888;
        }

        footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        #printButton {
            display: none;
            background-color: #FF5733;
            color: white;
            padding: 12px 25px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 200px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }

        #printButton:hover {
            background-color: #e04e1c;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
    <!-- Include PapaParse Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Beed Cyber Infotech KYP</h1>
        <h2>Final Exam Slot Wise</h2>

        <form id="uploadForm">
            <label for="tableHeader">Enter Table Header Text:</label>
            <input type="text" id="tableHeader" placeholder="Enter your table header" required>

            <label for="csvFile">Select CSV File:</label>
            <input type="file" id="csvFile" name="csvFile" accept=".csv">

            <button type="button" id="processButton">Upload and Process</button>
        </form>

        <div id="result">
            <!-- Table will be dynamically inserted here -->
        </div>

        <button id="printButton">Print Report</button>
    </div>

    <footer>
        <p>This page developed by <strong>Mr. Hanuman Pawar</strong>.</p>
        <p><em>This data is computer generated.</em></p>
    </footer>

    <script>
        document.getElementById("processButton").addEventListener("click", function() {
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText) {
                alert('Please enter the table header text');
                return;
            }

            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            try {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        console.log(results.data);
                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th colspan="8">${tableHeaderText}</th>
                                </tr>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Learner Name</th>
                                    <th>Learner Code</th>
                                    <th>Batch</th>
                                    <th>BS-CIT</th>
                                    <th>BS-CLS</th>
                                    <th>BS-CSS</th>
                                    <th>Sign</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        const learnerData = {};
                        results.data.forEach((row) => {
                            const learnerCode = row['Learner Code'];
                            const examSlot = row['Exam Slot'];
                            const learnerName = row['Name'] || 'N/A';
                            const course = row['Course'];
                            const batch = row['Batch'] || 'N/A';

                            if (!learnerData[learnerCode]) {
                                learnerData[learnerCode] = {
                                    name: learnerName,
                                    learnerCode,
                                    batch,
                                    BS_CIT: '-',
                                    BS_CLS: '-',
                                    BS_CSS: '-'
                                };
                            }

                            if (course === 'BS-CIT') learnerData[learnerCode].BS_CIT = examSlot || '-';
                            if (course === 'BS-CLS') learnerData[learnerCode].BS_CLS = examSlot || '-';
                            if (course === 'BS-CSS') learnerData[learnerCode].BS_CSS = examSlot || '-';
                        });

                        let serialNumber = 0;
                        for (const learnerCode in learnerData) {
                            const learner = learnerData[learnerCode];
                            if (learner.BS_CIT !== '-' || learner.BS_CLS !== '-' || learner.BS_CSS !== '-') {
                                serialNumber++;
                                tableHtml += `<tr>
                                    <td>${serialNumber}</td>
                                    <td>${learner.name}</td>
                                    <td>${learner.learnerCode}</td>
                                    <td>${learner.batch}</td>
                                    <td>${learner.BS_CIT}</td>
                                    <td>${learner.BS_CLS}</td>
                                    <td>${learner.BS_CSS}</td>
                                    <td></td>
                                </tr>`;
                            }
                        }

                        tableHtml += "</tbody></table>";
                        document.getElementById("result").innerHTML = tableHtml;
                        document.getElementById("printButton").style.display = "block";
                    },
                    error: function(error) {
                        alert("Error parsing CSV file.");
                    }
                });
            } catch (err) {
                alert("Error uploading file.");
            }
        });

        document.getElementById("printButton").addEventListener("click", () => {
            const printContent = document.getElementById("result").innerHTML;
            const printWindow = window.open("", "", "width=800,height=600");
            printWindow.document.write(`<html><head><title>Print Report</title></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            printWindow.print();
        });
    </script>
</body>
</html>
