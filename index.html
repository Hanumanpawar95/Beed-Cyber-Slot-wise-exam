<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Learner Data</title>
    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            margin: 0;
        }

        h1 {
            color: #0056b3;
            margin-top: 20px;
            font-size: 2.5rem;
        }

        h2 {
            color: #0288d1;
            font-size: 1.8rem;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #0288d1;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:nth-child(odd) {
            background-color: #fff;
        }

        tr:hover {
            background-color: #eef3f8;
        }

        td {
            color: #444;
        }

        .btn {
            display: inline-block;
            padding: 10px 25px;
            margin: 20px 10px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .upload-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .upload-form input[type="text"],
        .upload-form input[type="file"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }

        footer a {
            color: #0288d1;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Beed Cyber Infotech KYP</h1>
        <h2>Final Exam Slot Wise</h2>
        <form id="uploadForm" class="upload-form">
            <label for="tableHeader">Enter Table Header Text:</label>
            <input type="text" id="tableHeader" placeholder="Enter your table header" required>
            <label for="csvFile">Select CSV File:</label>
            <input type="file" id="csvFile" name="csvFile" accept=".csv">
            <button type="submit" class="btn">Upload and Process</button>
        </form>
        <div id="result"></div>
        <button id="printButton" class="btn" style="display: none;">Print Report</button>
    </div>

    <footer>
        <p>Page developed by <strong>Mr. Hanuman Pawar</strong>.</p>
        <p><em>All data is computer-generated.</em></p>
    </footer>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const tableHeaderText = document.getElementById("tableHeader").value;
            const file = document.getElementById("csvFile").files[0];

            if (!tableHeaderText) {
                alert('Please enter the table header text');
                return;
            }

            if (!file) {
                alert('Please select a CSV file');
                return;
            }

            try {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        console.log(results.data);
                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th colspan="8">${tableHeaderText}</th>
                                </tr>
                                <tr>
                                    <th>Sr. No.</th>
                                    <th>Learner Name</th>
                                    <th>Learner Code</th>
                                    <th>Batch</th>
                                    <th>BS-CIT</th>
                                    <th>BS-CLS</th>
                                    <th>BS-CSS</th>
                                    <th>Sign</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        const learnerData = {};
                        results.data.forEach((row) => {
                            const learnerCode = row['Learner Code'];
                            const examSlot = row['Exam Slot'];
                            const learnerName = row['Name'] || 'N/A';
                            const course = row['Course'];
                            const batch = row['Batch'] || 'N/A';

                            if (!learnerData[learnerCode]) {
                                learnerData[learnerCode] = {
                                    name: learnerName,
                                    learnerCode,
                                    batch,
                                    BS_CIT: '-',
                                    BS_CLS: '-',
                                    BS_CSS: '-'
                                };
                            }

                            if (course === 'BS-CIT') learnerData[learnerCode].BS_CIT = examSlot || '-';
                            if (course === 'BS-CLS') learnerData[learnerCode].BS_CLS = examSlot || '-';
                            if (course === 'BS-CSS') learnerData[learnerCode].BS_CSS = examSlot || '-';
                        });

                        let serialNumber = 0;
                        for (const learnerCode in learnerData) {
                            const learner = learnerData[learnerCode];
                            if (learner.BS_CIT !== '-' || learner.BS_CLS !== '-' || learner.BS_CSS !== '-') {
                                serialNumber++;
                                tableHtml += `<tr>
                                    <td>${serialNumber}</td>
                                    <td>${learner.name}</td>
                                    <td>${learner.learnerCode}</td>
                                    <td>${learner.batch}</td>
                                    <td>${learner.BS_CIT}</td>
                                    <td>${learner.BS_CLS}</td>
                                    <td>${learner.BS_CSS}</td>
                                    <td></td>
                                </tr>`;
                            }
                        }

                        tableHtml += "</tbody></table>";
                        document.getElementById("result").innerHTML = tableHtml;
                        document.getElementById("printButton").style.display = "block";
                    },
                    error: function(error) {
                        alert("Error parsing CSV file.");
                    }
                });
            } catch (err) {
                alert("Error uploading file.");
            }
        });

        document.getElementById("printButton").addEventListener("click", () => {
            const printContent = document.getElementById("result").innerHTML;
            const printWindow = window.open("", "", "width=800,height=600");
            printWindow.document.write(`<html><head><title>Print Report</title></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            printWindow.print();
        });
    </script>
</body>
</html>
